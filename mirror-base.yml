# Shared base for every spec in this repository (marp-team).
#
# NOT a spec: it has no name/target/source and is never loaded on its own.
# Everything a package owns — name, target, source, assets, asset_type,
# metadata, catalog, tests, versions, platforms, announce — stays in that
# package's own mirror.yml.
#
# ⚠️ `extends:` is a SHALLOW merge of top-level keys. A spec that sets a key
# below replaces that block OUTRIGHT. `platforms:` is deliberately NOT here:
# the container matrix follows a per-package libc measurement.

skip_prereleases: true
cascade: true
build_timestamp: date

verify:
  github_asset_digest: true   # if_present: releases before 4.2.0 declare none

concurrency:
  # ~47 MB archives around a ~120 MB Node single-executable binary.
  max_downloads: 8
  max_bundles: 4
  max_pushes: 2
  rate_limit_ms: 100
  max_retries: 3
  compression_threads: 0

notify:
  discord:
    webhook_secret: OCX_MIRROR_DISCORD_HOOK
    user_id: "227748867204972545"  # pinged in-message on failures
